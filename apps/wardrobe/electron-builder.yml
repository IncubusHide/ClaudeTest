appId: com.gianluca.wardrobetracker
productName: Wardrobe Tracker
copyright: Copyright © 2026

directories:
  output: release
  buildResources: build

files:
  - out/**
  - package.json

# SQLite comes from Electron's bundled Node, so there is no native module to
# rebuild or unpack at package time.
npmRebuild: false
nodeGypRebuild: false

win:
  target:
    - target: nsis
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Wardrobe Tracker
